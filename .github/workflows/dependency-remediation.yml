name: Isolated dependency remediation
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  actions: read
jobs:
  retrieve:
    if: github.event.pull_request.number == 12 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/phase6-p0-reliability-cloud'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: remediation-evidence
          run-id: 45465244593
          github-token: ${{ github.token }}
          path: /tmp/evidence
      - name: Export validated manifests only
        run: |
          node <<'JS'
          const fs = require('fs');
          const root = '/tmp/evidence/work/fashion-mvp/fashion-mvp/';
          const audit = JSON.parse(fs.readFileSync(root+'audit-runtime.json'));
          if (audit.metadata.vulnerabilities.total !== 0) process.exit(1);
          for (const file of ['package.json','package-lock.json']) {
            const b = fs.readFileSync(root+file).toString('base64');
            for (let i=0;i<b.length;i+=3000) console.log('MANIFEST_CHUNK '+file+' '+(i/3000)+' '+b.slice(i,i+3000));
          }
          JS
